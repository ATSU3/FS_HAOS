# Board: M5Stack AtomS3 (M5Stack)
# Definition: definitions/boards/m5stack-atoms3/manifest.yaml

esphome:
  name: current-sensor
  friendly_name: current-sensor

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: 
ota:
  - platform: esphome

wifi:
  ssid: 
  password: 

captive_portal:

# WiFi電波強度とHA接続状態（表示用）
sensor:
  
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 10s

  - platform: adc
    pin: GPIO1              # Grove G1 / 黄（信号）
    id: adc_ct
    attenuation: 12db      # ~0-3.1V フルスケール（古い版なら 11db）
    update_interval: never # ct_clampが直接サンプリングするのでnever

  - platform: ct_clamp
    sensor: adc_ct
    name: "電流"
    id: measured_current
    sample_duration: 200ms # 50/60Hzどちらも整数周期（浜松は60Hz）
    update_interval: 5s
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 2

    filters:
      - calibrate_linear:
          - 0.01 -> 0.0
          - 0.42 -> 1.3  # ←この値は必ず実測して置き換える

  # 皮相電力（単相100Vと仮定）
  - platform: template
    name: "apparent power"
    id: apparent_power
    lambda: 'return id(measured_current).state * 100.0;'
    unit_of_measurement: "VA"
    accuracy_decimals: 0
    update_interval: 5s

  # 力率を掛けた推定消費電力
  - platform: template
    name: "estimated power"
    id: est_power
    lambda: 'return id(measured_current).state * 100.0 * 0.85;'  # 0.85=想定力率
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 5s

  # 日積算電力量
  - platform: total_daily_energy
    name: "Daily accumulated electric energy"
    power_id: est_power
    unit_of_measurement: "kWh"
    filters:
      - multiply: 0.001
    device_class: energy
    state_class: total_increasing

time:
  - platform: homeassistant
    id: ha_time


            
# ---- 内蔵LCD表示（AtomS3: GC9107 128x128）----
spi:
  clk_pin: GPIO17
  mosi_pin: GPIO21

# バックライト（GPIO16, PWM）
output:
  - platform: ledc
    pin: GPIO16
    id: bl_output
light:
  - platform: monochromatic
    output: bl_output
    name: "LCD Backlight"
    id: lcd_backlight
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 15
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 30

color:
  - id: c_white
    red: 100%
    green: 100%
    blue: 100%
  - id: c_green
    green: 100%
  - id: c_red
    red: 100%



binary_sensor:
  - platform: status
    id: ha_status      # ON=Home Assistantに接続中

display:
  - platform: mipi_spi
    model: GC9107
    id: atoms3_lcd
    cs_pin: GPIO15
    dc_pin: GPIO33
    reset_pin: GPIO34
    dimensions:
      width: 128
      height: 128
    invert_colors: true
    transform: disabled      # ← 追加
    rotation: "180"
    update_interval: 1s
    lambda: |-
      it.fill(Color::BLACK);

      // タイトル
      it.print(4, 2, id(font_small), id(c_white), "current-sensor");

      // WiFi RSSI
      if (id(wifi_rssi).has_state()) {
        it.printf(4, 22, id(font_small), id(c_white), "WiFi %.0f dBm", id(wifi_rssi).state);
      } else {
        it.print(4, 22, id(font_small), id(c_red), "WiFi --");
      }

      // HA接続状態（緑=接続 / 赤=切断）
      it.print(4, 40, id(font_small),
               id(ha_status).state ? id(c_green) : id(c_red),
               id(ha_status).state ? "HA connected" : "HA offline");

      // 電流値（大きく中央）
      if (id(measured_current).has_state()) {
        it.printf(64, 74, id(font_big), id(c_white), TextAlign::TOP_CENTER,
                  "%.2f A", id(measured_current).state);
      } else {
        it.print(64, 74, id(font_big), id(c_white), TextAlign::TOP_CENTER, "-- A");
      }  


