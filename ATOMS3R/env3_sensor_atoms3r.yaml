# Board: M5Stack AtomS3R + Unit ENV III (SHT30 + QMP6988)
# AtomS3 版からの移植: LCDドライバ / SPIピン / バックライト制御が変更

esphome:
  name: env-sensor-r
  friendly_name: env-sensor-r

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# AtomS3R は 8MB PSRAM 搭載。この構成では不要だが、
# LVGL 等を使う場合は以下を有効化する
# psram:
#   mode: octal
#   speed: 80MHz

# ---------- 外部コンポーネント ----------
# lp5562（バックライト制御IC）は ESPHome 本体に入っていないため、
# M5Stack 提供の external component を取得する必要がある
external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [lp5562]
    refresh: 0s

logger:

api:
  encryption:
    key: "GdaZqeNopx/X9IAeJP+l+nUwREUu6eOEXe4cIKDTGrc="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: env-sensor-r Fallback Hotspot
    password: "hmEw2XpXO5CM"

captive_portal:

# ---------- I2C ----------
# AtomS3R は内部バス（バックライト制御IC LP5562, IMU）と
# Grove バス（ENV IV）の2系統になる
i2c:
  # 内部バス: LP5562 (0x30), BMI270 (0x68), BMM150
  - id: bsp_bus
    sda:
      number: GPIO45
      ignore_strapping_warning: true
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    scan: true
    frequency: 100kHz

  # Grove ポート: ENV III (SHT30 + QMP6988)
  - id: grove_bus
    sda: GPIO2
    scl: GPIO1
    scan: true
    frequency: 100kHz

# ---------- SPI（内蔵LCD）----------
# AtomS3: CLK=GPIO17 → AtomS3R: CLK=GPIO15
spi:
  clk_pin: GPIO15
  mosi_pin: GPIO21

# ---------- バックライト（LP5562 経由）----------
# AtomS3 の GPIO16 + ledc は AtomS3R では使えない
lp5562:
  id: lp5562_led
  i2c_id: bsp_bus
  use_internal_clk: true
  white_current: 17.5

output:
  - platform: lp5562
    id: backlight_output
    lp5562_id: lp5562_led
    channel: white

light:
  - platform: monochromatic
    output: backlight_output
    id: backlight
    name: "Backlight"
    restore_mode: RESTORE_DEFAULT_ON

color:
  - id: col_white
    red: 100%
    green: 100%
    blue: 100%
  - id: col_gray
    red: 45%
    green: 45%
    blue: 45%
  - id: col_bar
    red: 12%
    green: 12%
    blue: 18%
  - id: col_green
    red: 15%
    green: 85%
    blue: 30%
  - id: col_red
    red: 95%
    green: 25%
    blue: 25%
  - id: col_cyan
    red: 30%
    green: 85%
    blue: 95%

font:
  - file: "gfonts://Roboto"
    id: font_s
    size: 13
    glyphs: '!"%()+=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz '
  - file: "gfonts://Roboto"
    id: font_m
    size: 18
    glyphs: '%.-°0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ '
  - file: "gfonts://Roboto@700"
    id: font_l
    size: 38
    glyphs: '.-°0123456789 '

# ---------- ディスプレイ ----------
# AtomS3: st7789v プラットフォーム / GC9107 系ピン
# AtomS3R: mipi_spi プラットフォーム / ST7789V, CS=14 DC=42 RST=48
display:
  - platform: mipi_spi
    id: atoms3r_lcd
    model: ST7789V
    cs_pin: GPIO14
    dc_pin: GPIO42
    reset_pin: GPIO48
    data_rate: 40MHz
    dimensions:
      width: 128
      height: 128
      offset_width: 2
      offset_height: 1
    invert_colors: true
    update_interval: 1s
    lambda: |-
      it.fill(Color::BLACK);

      const bool wifi_ok = wifi::global_wifi_component->is_connected();
      const bool api_ok  = api::global_api_server->is_connected();

      // ステータスバー
      it.filled_rectangle(0, 0, 128, 18, id(col_bar));
      it.print(4, 9, id(font_s), id(col_white), TextAlign::CENTER_LEFT, "WiFi");
      it.filled_circle(38, 9, 4, wifi_ok ? id(col_green) : id(col_red));
      it.print(54, 9, id(font_s), id(col_white), TextAlign::CENTER_LEFT, "HA");
      it.filled_circle(80, 9, 4, api_ok ? id(col_green) : id(col_red));
      if (id(rssi).has_state()) {
        it.printf(125, 9, id(font_s), id(col_gray), TextAlign::CENTER_RIGHT,
                  "%.0f", id(rssi).state);
      }

      // 温度
      if (id(sht_temp).has_state()) {
        it.printf(64, 48, id(font_l), id(col_cyan), TextAlign::CENTER,
                  "%.1f", id(sht_temp).state);
        it.print(120, 34, id(font_s), id(col_cyan), TextAlign::CENTER_RIGHT, "°C");
      } else {
        it.print(64, 48, id(font_l), id(col_gray), TextAlign::CENTER, "--.-");
      }

      // 湿度・気圧
      if (id(sht_hum).has_state()) {
        it.printf(64, 82, id(font_m), id(col_white), TextAlign::CENTER,
                  "%.1f %%RH", id(sht_hum).state);
      } else {
        it.print(64, 82, id(font_m), id(col_gray), TextAlign::CENTER, "--.- %RH");
      }

      if (id(bmp_press).has_state()) {
        it.printf(64, 106, id(font_m), id(col_white), TextAlign::CENTER,
                  "%.1f hPa", id(bmp_press).state);
      } else {
        it.print(64, 106, id(font_m), id(col_gray), TextAlign::CENTER, "---.- hPa");
      }

# ---------- センサー ----------
sensor:
  - platform: sht3xd
    i2c_id: grove_bus
    address: 0x44
    temperature:
      name: "Temperature"
      id: sht_temp
      accuracy_decimals: 1
    humidity:
      name: "Humidity"
      id: sht_hum
      accuracy_decimals: 1
    update_interval: 30s

  - platform: qmp6988
    i2c_id: grove_bus
    address: 0x70
    iir_filter: 16x
    temperature:
      name: "Pressure Sensor Temperature"
      id: bmp_temp
      oversampling: 8x
      internal: true
    pressure:
      name: "Pressure"
      id: bmp_press
      oversampling: 8x
      accuracy_decimals: 1
    update_interval: 30s

  - platform: wifi_signal
    name: "WiFi Signal"
    id: rssi
    update_interval: 60s

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Button"