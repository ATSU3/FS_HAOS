esphome:
  name: atoms3-bthome-env3

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/dz0ny/esphome-bthome
      ref: main
    components: [bthome]

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

# ---------- I2C（Grove端子：ENV III）----------
i2c:
  sda: GPIO2
  scl: GPIO1
  scan: true

# ---------- SPI（内蔵LCD）----------
spi:
  clk_pin: GPIO17
  mosi_pin: GPIO21

# ---------- バックライト ----------
output:
  - platform: ledc
    pin: GPIO16
    id: backlight_output

light:
  - platform: monochromatic
    output: backlight_output
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# ---------- フォント ----------
font:
  - file: "gfonts://Roboto"
    id: font_s
    size: 11
  - file: "gfonts://Roboto"
    id: font_m
    size: 16
  - file: "gfonts://Roboto@700"
    id: font_l
    size: 26

color:
  - id: c_bg
    hex: "000000"
  - id: c_title
    hex: "00C8FF"
  - id: c_val
    hex: "FFFFFF"
  - id: c_sub
    hex: "888888"
  - id: c_ok
    hex: "00FF64"

# ---------- センサー ----------
sensor:
  - platform: sht3xd
    address: 0x44
    temperature:
      id: temp
    humidity:
      id: humi
    update_interval: 10s

  - platform: qmp6988
    address: 0x70
    iir_filter: 4x
    pressure:
      id: pres
      oversampling: 8x
    temperature:
      id: temp_qmp
      internal: true
    update_interval: 10s

  - platform: uptime
    id: sys_uptime
    update_interval: 5s

# ---------- BTHome ----------
bthome:
  ble_stack: nimble
  min_interval: 5s
  max_interval: 10s
  tx_power: 0
  sensors:
    - type: temperature
      id: temp
    - type: humidity
      id: humi
    - type: pressure
      id: pres

# ---------- ディスプレイ ----------
display:
  - platform: ili9xxx
    model: ST7789V
    cs_pin: GPIO15
    dc_pin: GPIO33
    reset_pin: GPIO34
    invert_colors: true
    dimensions:
      width: 128
      height: 128
      offset_width: 2
      offset_height: 1
    update_interval: 1s
    lambda: |-
      it.fill(id(c_bg));

      // ヘッダー
      it.print(4, 2, id(font_s), id(c_title), "BTHome / BLE ADV");
      it.line(0, 16, 128, 16, id(c_sub));

      // 温度（大きく）
      if (id(temp).has_state()) {
        it.printf(4, 20, id(font_l), id(c_val), "%.1f", id(temp).state);
        it.print(78, 30, id(font_m), id(c_sub), "C");
      } else {
        it.print(4, 24, id(font_m), id(c_sub), "-- .-");
      }

      // 湿度・気圧
      if (id(humi).has_state())
        it.printf(4, 54, id(font_m), id(c_val), "RH  %.1f %%", id(humi).state);
      if (id(pres).has_state())
        it.printf(4, 74, id(font_m), id(c_val), "P   %.0f hPa", id(pres).state);

      // ステータス
      it.line(0, 96, 128, 96, id(c_sub));
      it.print(4, 99, id(font_s), id(c_ok), "ADV 5-10s / NimBLE");

      // BLE MAC（HA登録時の識別用）
      std::string mac = get_mac_address_pretty();
      it.printf(4, 112, id(font_s), id(c_sub), "%s", mac.c_str());

# ---------- 本体ボタンでバックライト切替 ----------
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    id: front_button
    on_click:
      then:
        - light.toggle: backlight
